[project]
name = "mewc-synth"
version = "0.1.0"
description = "Synthetic camera-trap snips for low-count MEWC classes"
requires-python = "==3.12.*"
dependencies = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "peft",
    "safetensors",
    "pillow",
    "numpy",
    "pandas",
    "pyyaml",
    "pyarrow",
    "imagehash",
    "scipy",
    "scikit-learn",
]
